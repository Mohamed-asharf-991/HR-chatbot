<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR Chatbot</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --surface: #ffffff;
      --text: #1c2433;
      --muted: #5d6b82;
      --primary: #2f6fed;
      --primary-dark: #1f56c4;
      --border: #dde4ef;
      --success: #27ae60;
      --error: #c0392b;
      --radius: 14px;
      --font: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1520;
        --surface: #182130;
        --text: #e8edf6;
        --muted: #9aa8bf;
        --primary: #5b8dff;
        --primary-dark: #7aa2ff;
        --border: #263349;
        --success: #2ecc71;
        --error: #ff7b6b;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    .app {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 1.7rem;
    }

    .sub {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .ask {
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      resize: vertical;
      min-height: 52px;
      padding: 12px 14px;
      font: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    textarea:focus-visible,
    button:focus-visible,
    .btn:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }

    button,
    .btn {
      background: var(--primary);
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 0 22px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    button:hover,
    .btn:hover {
      background: var(--primary-dark);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 1rem;
      color: var(--muted);
      font-weight: 600;
    }

    .answer {
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .sources ul {
      margin: 0;
      padding-left: 20px;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.5;
    }

    .loading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 3s;
      }
    }

    .error {
      color: var(--error);
    }

    /* ---- Open positions ---- */
    .jobs-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .job-card {
      padding: 14px 0;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .job-card:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .job-title {
      font-weight: 600;
      font-size: 1.1rem;
      margin: 0;
    }

    .badge {
      background: rgba(46, 204, 113, 0.15);
      color: var(--success);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .job-details {
      color: var(--muted);
      font-size: .92rem;
    }

    .job-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 4px;
    }

    .job-actions .btn {
      padding: 10px 18px;
    }

    .btn-secondary {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .btn-secondary:hover {
      background: rgba(47, 111, 237, 0.08);
      color: var(--primary-dark);
    }

    .muted {
      color: var(--muted);
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <h1>HR Chatbot</h1>
      <p class="sub">Ask a question about BrightPath company policies.</p>
    </header>

    <div class="ask">
      <textarea id="question" rows="2" placeholder="For example: What are the core hours?"></textarea>
      <button id="send">Ask</button>
    </div>

    <section id="loading" class="card loading" hidden>
      <div class="spinner"></div><span>Thinking…</span>
    </section>

    <section id="error" class="card error" hidden></section>

    <section id="result" class="card" hidden>
      <h2>Answer</h2>
      <div id="answer" class="answer"></div>
      <div class="sources" id="sourcesBox" hidden style="margin-top:16px">
        <h2>Sources</h2>
        <ul id="sources"></ul>
      </div>
    </section>

    <section class="card" aria-labelledby="jobsHeading">
      <h2 id="jobsHeading">Open positions</h2>
      <div id="jobs" class="jobs-container" aria-live="polite">
        <div class="muted">Loading open positions…</div>
      </div>
    </section>
  </div>

  <script>
    // n8n PRODUCTION webhook for the chatbot (workflow must be Active)
    const CHATBOT_WEBHOOK_URL = "https://mo-9-9-1.app.n8n.cloud/webhook/rag";

    // n8n PRODUCTION webhook that returns the open positions (GET)
    const JOBS_WEBHOOK_URL = "https://mo-9-9-1.app.n8n.cloud/webhook/Jobs";

    const $ = (id) => document.getElementById(id);
    const input = $("question"), sendBtn = $("send");

    async function ask() {
      const question = input.value.trim();
      if (!question) { input.focus(); return; }

      sendBtn.disabled = true;
      $("result").hidden = true; $("error").hidden = true; $("loading").hidden = false;

      try {
        const res = await fetch(CHATBOT_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });
        if (!res.ok) throw new Error("Server returned status " + res.status);

        let data = await res.json();
        if (Array.isArray(data)) data = data[0];
        if (!data || !data.answer) throw new Error("The reply did not contain an answer.");

        $("answer").textContent = data.answer;

        const list = $("sources"); list.innerHTML = "";
        const sources = Array.isArray(data.sources) ? data.sources : (data.sources ? [data.sources] : []);
        sources.forEach((s) => {
          const li = document.createElement("li");
          li.textContent = typeof s === "string" ? s : JSON.stringify(s);
          list.appendChild(li);
        });
        $("sourcesBox").hidden = sources.length === 0;
        $("result").hidden = false;
      } catch (err) {
        $("error").textContent = "Could not get an answer. " + err.message +
          " Check that the workflow is active and try again.";
        $("error").hidden = false;
      } finally {
        $("loading").hidden = true;
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener("click", ask);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
    });

    // ---------------- Open positions ----------------

    // Lowercase and drop spaces, underscores and hyphens so "Job state ", "job_state" and "jobState" all match
    function norm(s) {
      return String(s).toLowerCase().replace(/[\s_\-]/g, "");
    }

    // Read a field by any of the accepted column names; returns "" when missing or empty
    function field(row, names) {
      const wanted = names.map(norm);
      for (const key of Object.keys(row)) {
        if (wanted.includes(norm(key))) {
          const v = row[key];
          if (v !== undefined && v !== null && String(v).trim() !== "") return String(v).trim();
        }
      }
      return "";
    }

    // Turn whatever n8n sends back (array, single object, wrapped list) into a flat array of rows
    function toRows(data) {
      if (data === null || data === undefined) return [];
      if (Array.isArray(data)) return data.flatMap(toRows);
      if (typeof data === "object") {
        for (const key of ["json", "data", "jobs", "items", "body"]) {
          if (data[key] && typeof data[key] === "object") return toRows(data[key]);
        }
        return [data];
      }
      return [];
    }

    function makeButton(label, url, secondary) {
      const a = document.createElement("a");
      a.className = secondary ? "btn btn-secondary" : "btn";
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = label;
      return a;
    }

    async function fetchJobs() {
      const box = $("jobs");
      try {
        const response = await fetch(JOBS_WEBHOOK_URL, { headers: { "Accept": "application/json" } });
        if (!response.ok) throw new Error("Status " + response.status);

        const raw = await response.json();
        console.log("Jobs webhook response:", raw);

        const jobs = toRows(raw).filter((row) => {
          if (!field(row, ["job title", "title"])) return false;            // no title -> skip
          const status = field(row, ["job state", "status", "state"]);
          return !status || status.toLowerCase() === "open";                // only open jobs
        });
        console.log("Jobs shown:", jobs);

        box.textContent = "";
        if (!jobs.length) {
          const empty = document.createElement("div");
          empty.className = "muted";
          empty.textContent = "No open positions right now.";
          box.appendChild(empty);
          return;
        }

        jobs.forEach((row) => {
          const card = document.createElement("div");
          card.className = "job-card";

          const header = document.createElement("div");
          header.className = "job-header";
          const title = document.createElement("h3");
          title.className = "job-title";
          title.textContent = field(row, ["job title", "title"]);
          header.appendChild(title);

          const status = field(row, ["job state", "status", "state"]);
          if (status) {
            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = status;
            header.appendChild(badge);
          }
          card.appendChild(header);

          const details = document.createElement("div");
          details.className = "job-details";
          const id = field(row, ["id", "job id"]);
          const dept = field(row, ["department"]);
          if (id) {
            const line = document.createElement("div");
            const label = document.createElement("strong");
            label.textContent = "Job ID: ";
            line.append(label, document.createTextNode(id));
            details.appendChild(line);
          }
          if (dept) {
            const line = document.createElement("div");
            const label = document.createElement("strong");
            label.textContent = "Department: ";
            line.append(label, document.createTextNode(dept));
            details.appendChild(line);
          }
          if (details.childNodes.length) card.appendChild(details);

          const actions = document.createElement("div");
          actions.className = "job-actions";
          const applyUrl = field(row, ["apply_link_job_app", "apply link"]);
          const referUrl = field(row, ["apply_link_referral", "referral link"]);
          if (applyUrl.startsWith("https://")) actions.appendChild(makeButton("Apply Now", applyUrl, false));
          if (referUrl.startsWith("https://")) actions.appendChild(makeButton("Refer a Candidate", referUrl, true));
          if (actions.childNodes.length) card.appendChild(actions);

          box.appendChild(card);
        });
      } catch (err) {
        console.error("Could not load open positions:", err);
        box.textContent = "";
        const msg = document.createElement("div");
        msg.className = "error";
        msg.textContent = "Could not load open positions. Check that the workflow is active.";
        box.appendChild(msg);
      }
    }

    document.addEventListener("DOMContentLoaded", fetchJobs);
  </script>
</body>

</html>
